# 정적 파일과 백엔드를 한 오리진에서 낸다. 프론트가 자기 오리진만 알면 되고(src/api/endpoint.ts),
# 그 결과 CORS 설정도 혼합 콘텐츠 차단도 생기지 않는다.
server {
    listen 80;
    server_name _;

    # 방 생성·프로필·안건 텍스트가 전부라 이 이상은 받을 이유가 없다.
    client_max_body_size 64k;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 화면 전환은 MemoryRouter가 메모리에서만 하므로 주소는 항상 /다(src/main.tsx).
        # 딥링크가 구조적으로 없지만, 오타 주소로 404를 보여 주는 것보다 표지로 보내는 편이 낫다.
        try_files $uri /index.html;
    }

    # 파일명에 해시가 붙는 산출물만 길게 캐시한다. index.html을 캐시하면 배포해도 옛 화면이 남는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 백엔드는 이 헤더의 첫 항목을 클라이언트 IP로 본다(backend/app/api/deps.py).
        # 그래서 백엔드의 TRUST_PROXY는 이 프록시를 앞에 둘 때만 true여야 한다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;

        # HTTP/1.0은 Upgrade 헤더를 넘기지 못한다. 이 세 줄이 없으면 핸드셰이크부터 실패한다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 기본값 60초로 두면 아무도 말하지 않는 대기방의 소켓이 조용히 끊긴다.
        # 하트비트 20초(backend/app/config.py의 ws_ping_interval_s)·pong 대기 60초보다 커야 한다.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        # 소켓 프레임을 모아 두면 지연이 생긴다. 눈치게임처럼 밀리초를 다투는 판정이 흔들린다.
        proxy_buffering off;
    }
}
