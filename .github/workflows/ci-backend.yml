name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'  # backend 폴더에 변경이 있을 때만 실행
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
  workflow_call:  # develop 배포 파이프라인이 게이트로 호출한다

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # 이 워크플로우 내의 모든 run 명령어의 기본 실행 위치를 backend 폴더로 고정합니다.
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # backend/Dockerfile · bootstrap.sh와 같은 버전을 쓴다. 어긋나면
          # CI가 통과한 코드가 배포에서 다르게 돈다.
          python-version: '3.14.6'
          cache: 'pip'            # pip 패키지 캐싱으로 빌드 속도 향상

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 요구사항 파일이 있으면 설치 (requirements.txt 사용 가정)
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 테스트와 린트를 위한 패키지 설치
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          # 파이썬 문법 오류나 코드 스타일 검사
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 계약 테스트는 실제 MySQL 8.4에 붙어 돈다(tests/conftest.py). VIRTUAL 생성
      # 컬럼 위의 UNIQUE와 CHECK 12건이 이 제품의 마지막 방어선이라 가짜 DB로는
      # 검증되지 않는다.
      #
      # 서비스 컨테이너 대신 개발용 compose를 그대로 쓴다. 서비스 컨테이너에는
      # command를 줄 수 없어 --default-time-zone=+00:00 과 utf8mb4_0900_ai_ci 가
      # 빠지고, 그러면 만료 시각 계산과 닉네임 대소문자 중복 판정이 로컬과 달라진다.
      # compose를 쓰면 db_migration/sql 9개 파일의 적용 순서도 함께 재현된다.
      #
      # compose 파일은 저장소 루트에 있으므로 working-directory를 되돌린다.
      # 그리고 database 서비스만 띄운다 — backend까지 띄우면 이미지 빌드로 CI가
      # 느려지는 데다, 컨테이너와 pytest가 같은 DB를 두고 경합해 테스트가 멈춘다.
      #
      # MYSQL_ROOT_PASSWORD는 compose가 필수로 요구한다(.env가 CI에는 없다).
      # 이 값은 CI 안에서만 살아 있고 매 실행마다 컨테이너와 함께 버려진다.
      - name: Start MySQL
        working-directory: .
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: docker compose up -d --wait --wait-timeout 180 database

      - name: Run Tests with pytest
        run: |
          # 작성된 테스트 코드 실행. 접속 정보는 app/config.py 기본값을 쓴다
          # (modupick/modupick @ 127.0.0.1:3307).
          pytest

      - name: Dump MySQL logs on failure
        if: failure()
        working-directory: .
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: docker compose logs database

      - name: Stop MySQL
        if: always()
        working-directory: .
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: docker compose down -v
