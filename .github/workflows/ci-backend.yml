name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'  # backend 폴더에 변경이 있을 때만 실행
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # 이 워크플로우 내의 모든 run 명령어의 기본 실행 위치를 backend 폴더로 고정합니다.
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'  # 사용하시는 파이썬 버전에 맞게 수정하세요
          cache: 'pip'            # pip 패키지 캐싱으로 빌드 속도 향상

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 요구사항 파일이 있으면 설치 (requirements.txt 사용 가정)
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 테스트와 린트를 위한 패키지 설치
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          # 파이썬 문법 오류나 코드 스타일 검사
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests with pytest
        run: |
          # 작성된 테스트 코드 실행
          pytest
