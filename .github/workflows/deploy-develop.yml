name: ModuPick Develop CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🌟 토큰 발급 단계가 사라지고, 바로 도커 빌드 및 실행만 진행합니다.
      - name: Build and Deploy with Docker Compose
        run: |
          docker-compose down
          docker-compose up -d --build
